name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Evaluates nixosConfigurations.nitro without building it: the closure
      # (~20 GB) does not fit on the runner.
      - run: nix flake check --no-build
      - run: nix fmt -- --ci
